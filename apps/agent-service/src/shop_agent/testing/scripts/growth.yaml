# Scripted answers for the growth kinds of the `improvement` graph (tests, `simulate`, the e2e stack): read, then
# propose the menu strategy with the best expected profit, plus "do nothing"; the brand judge passes the copy.
improvement.brand_judge:
  - structured:
      scores:
        - {criterion: voice, score: 5, note: "Đúng giọng văn của cửa hàng."}
        - {criterion: truthful, score: 5, note: "Con số khớp với chương trình."}
        - {criterion: clarity, score: 4, note: "Ngắn gọn, rõ ràng."}
        - {criterion: rules, score: 5, note: "Không vi phạm quy tắc."}
improvement.investigate.revenue_gap:
  - tool_calls:
      - {name: get_active_promotions, args: {}}
      - {name: get_goal_pacing, args: {}}
      - {name: get_campaign_performance, args: {}}
      - {name: search_cases, args: {query: "revenue_gap", kind: revenue_gap}}
  - call: shop_agent.testing.script_fns:propose_growth
