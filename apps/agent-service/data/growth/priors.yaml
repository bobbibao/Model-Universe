# Lever priors (docs/GROWTH_AGENT.md section 6). ASSUMPTIONS from common small-retail figures, not this shop's data:
# each is a mean with a 10th-90th percentile range and a weight `n0` (how many measured outcomes it is worth). Measured
# outcomes move them: posterior = (n0 * prior + n * observed) / (n0 + n) (domain.growth.learning.update_priors).
promotion:
  uplift_per_pct: {mean: 0.04, low: 0.02, high: 0.07, n0: 5}      # extra units per 1% off, relative to the base
coupon:
  redemption: {mean: 0.15, low: 0.08, high: 0.25, n0: 5}          # share of orders that use it
  incremental: {mean: 0.3, low: 0.1, high: 0.5, n0: 5}            # share of those orders it created
post:
  views: {mean: 600, low: 250, high: 1500, n0: 5}
  click_rate: {mean: 0.012, low: 0.005, high: 0.025, n0: 5}
  order_rate: {mean: 0.02, low: 0.01, high: 0.035, n0: 5}
ads:
  meta: {mean: 2.5, low: 1.2, high: 4.0, n0: 5}                   # ROAS (conversion value / spend)
  google: {mean: 3.0, low: 1.5, high: 5.0, n0: 5}
  tiktok: {mean: 2.0, low: 0.8, high: 3.5, n0: 5}
