# Growth simulation scenario: Q4 2026 on the FakeShop demo catalog (`shop-agent simulate growth`). Amounts in whole VND.
# The calendar (data/market/events_vn.yaml) brings 10.10, 20/10, 11.11, Black Friday, 12.12 and Christmas; three market
# events are injected on given days, and `--assert` checks that each one is detected within a day.
name: q4
seed: 7
history_days: 180
weekday_factors: [0.85, 0.9, 1.0, 1.15, 1.35, 1.3, 0.8]
growth_over_history: 0.2
event_uplift: {womens_day_20_10: 1.3, black_friday: 1.8, christmas: 1.4}
double_day_uplift: 1.6
units_per_order: 1.4
coupon_order_share: 0.2
coupon_percent: 10
attributed_order_share: 0.45
catalog: []
competitors:
  - {name: "Thời Trang An Nhiên", website: "https://an-nhien.example", matched_skus: 12}
  - {name: "Phong Cách Sài Gòn", website: "https://phongcachsaigon.example", matched_skus: 8}
price_weeks: 8
trends:
  - {keyword: "áo khoác", category: ao, base: 45}
  - {keyword: "giày thể thao", category: giay, base: 55}
  - {keyword: "túi xách", category: tui, base: 30}
trend_days: 90
# The true response to a discount (the agent's prior says 0.04 extra units per 1% off; measurement teaches it this).
response_uplift_per_pct: 0.03
injections:
  - {day: 5, kind: trend_spike, keyword: "giày thể thao", factor: 1.8}
  - {day: 12, kind: competitor_undercut, factor: 1.15}
  - {day: 20, kind: roas_breach}
# The owner after the brand review, two weeks into the ramp: posts and small promotions run on their own, Meta ads ask,
# Google Search ads are still in shadow, TikTok is off (no video yet).
settings:
  brand.approved: true
  growth.caps: {monthly_ad_cap_vnd: 5000000, per_campaign_vnd: 3000000, per_day_vnd: 500000}
  autonomy:
    promotion: auto_low
    facebook_post: auto_low
    ads_meta: ask
    ads_google: shadow
    ads_tiktok: "off"
    inventory: ask
    ops_tasks: ask
  market.trend_keywords:
    - {keyword: "áo khoác", category: ao}
    - {keyword: "giày thể thao", category: giay}
    - {keyword: "túi xách", category: tui}
