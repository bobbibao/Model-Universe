# Growth scenario for FakeWorld (tests, `simulate`, local development without the web shop). Amounts in whole VND.
# Everything is generated deterministically from `seed`; the calendar is data/market/events_vn.yaml.
name: baseline
seed: 7
history_days: 180
# Relative sales per weekday, Monday first.
weekday_factors: [0.85, 0.9, 1.0, 1.15, 1.35, 1.3, 0.8]
growth_over_history: 0.2
# Demand multiplier inside an event's window (by calendar code); `double_*` days share one.
event_uplift: {tet: 2.0, valentine: 1.2, womens_day_8_3: 1.3, reunification: 1.3, mid_autumn: 1.2,
               womens_day_20_10: 1.3, black_friday: 1.8, christmas: 1.4}
double_day_uplift: 1.6
units_per_order: 1.4
coupon_order_share: 0.2
coupon_percent: 10
attributed_order_share: 0.45
# Empty: the catalog is the shop's (FakeShop's stock). A standalone scenario lists
# {sku, name, category, price_vnd, unit_cost_vnd, quantity, daily_units, created_days_ago}.
catalog: []
competitors:
  - {name: "Thời Trang An Nhiên", website: "https://an-nhien.example", matched_skus: 12, undercut_skus: 2}
  - {name: "Phong Cách Sài Gòn", website: "https://phongcachsaigon.example", matched_skus: 8, undercut_skus: 1,
     campaign: {title: "Giảm 30% toàn bộ giày", category: giay, discount_pct: 30, started_days_ago: 3, days: 8}}
price_weeks: 8
undercut_factor: 0.85
trends:
  - {keyword: "áo khoác", category: ao, base: 45}
  - {keyword: "giày thể thao", category: giay, base: 55, spike_days: 7, spike_factor: 1.6}
  - {keyword: "túi xách", category: tui, base: 30}
trend_days: 90
# Overrides of the owner's settings (keys as in analytics.agent_settings); the rest are the defaults.
settings:
  market.trend_keywords:
    - {keyword: "áo khoác", category: ao}
    - {keyword: "giày thể thao", category: giay}
    - {keyword: "túi xách", category: tui}
