# Google Gemini profile. Model ids: set LLM_MODEL_<ROLE> to the provider's current flagship and small models, e.g.
# `google_genai:<model>`; `shop-agent doctor --profile google --live` validates them. Prices must match the ids.
description: Google Gemini (set the model ids with LLM_MODEL_<ROLE>)
roles:
  planner: &google
    provider: google_genai
    model: gemini-2.5-pro
    params: {timeout: 180, max_retries: 2}
  writer: *google
  judge: *google
  worker:
    provider: google_genai
    model: gemini-2.5-flash
    params: {timeout: 120, max_retries: 2}
embeddings: {provider: ollama, model: bge-m3, dims: 1024}
prices_usd_per_mtok: {}
