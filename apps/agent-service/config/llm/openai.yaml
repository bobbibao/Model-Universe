# OpenAI profile. Model ids: set LLM_MODEL_PLANNER / LLM_MODEL_WORKER (and writer, judge) to the provider's current
# flagship and small models, e.g. `openai:<model>`; `shop-agent doctor --profile openai --live` validates them and the
# Phase 9 bake-off compares providers. Prices below must match the ids you choose.
description: OpenAI (set the model ids with LLM_MODEL_<ROLE>)
roles:
  planner: &openai
    provider: openai
    model: gpt-5
    params: {timeout: 180, max_retries: 2}
  writer: *openai
  judge: *openai
  worker:
    provider: openai
    model: gpt-5-mini
    params: {timeout: 120, max_retries: 2}
embeddings: {provider: ollama, model: bge-m3, dims: 1024}
prices_usd_per_mtok: {}
