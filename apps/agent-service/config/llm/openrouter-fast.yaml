description: Low-cost OpenRouter live acceptance testing; credentials use OPENAI_API_KEY.
roles:
  planner: &fast
    provider: openai
    model: openai/gpt-4.1-mini
    structured_method: function_calling
    params:
      base_url: https://openrouter.ai/api/v1
      use_responses_api: false
      timeout: 60
      max_retries: 0
      max_tokens: 4096
  writer: *fast
  judge: *fast
  worker: *fast
embeddings: {provider: ollama, model: bge-m3, dims: 1024}
prices_usd_per_mtok:
  openai/gpt-4.1-mini: [0.40, 1.60]
