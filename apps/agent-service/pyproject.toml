[project]
name = "model-universe-agent"
version = "2.0.0"
description = "Model Universe agent on LangGraph: closed improvement loop, growth agent and copilot (docs/ARCHITECTURE.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Orchestration, agents, runtime SDK
    "langgraph~=1.2.12",
    "langchain~=1.4.3",
    "langchain-core~=1.6",
    "deepagents~=0.7.20",
    "langgraph-sdk~=0.4.5",
    # Storage: vector store and production checkpointer/store
    "langchain-postgres~=0.0.18",
    "langchain-text-splitters~=1.1",
    "langgraph-checkpoint-postgres~=3.1",
    # Model providers: imported only by shop_agent.llm (import-linter contract)
    "langchain-ollama~=1.1",
    "langchain-anthropic~=1.7",
    "langchain-openai~=1.6",
    "langchain-google-genai~=4.4",
    # Infrastructure
    "psycopg[binary,pool]~=3.3",
    "pydantic~=2.12",
    "pydantic-settings~=2.15",
    "httpx~=0.28",
    "tenacity~=9.1",
    "pyjwt~=2.10",
    "structlog>=25.1,<26",  # langgraph-api (the `server` extra) requires structlog<26
    "pyyaml~=6.0",
    # Tracing (ADR-0012): the LangChain callback handler; off unless LANGFUSE_* keys are set.
    "langfuse~=4.15",
]

[project.optional-dependencies]
# The Agent Server for development and e2e (`langgraph dev`). The floor keeps the resolver from trading langgraph-api
# for a newer OpenTelemetry once `runtime` is in the same lock.
server = ["langgraph-cli[inmem]~=0.4.32", "langgraph-api>=0.15.1"]
# Market data collectors (Phase 5).
market = ["playwright~=1.63", "selectolax~=0.4", "pytrends~=4.9"]
# The production runtime (Aegra, ADR-0013): `aegra serve` with Postgres and Redis.
runtime = ["aegra-cli~=0.10.8", "aegra-api~=0.10.8"]

[project.scripts]
shop-agent = "shop_agent.ops:main"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "pytest-cov~=7.1",
    "hypothesis~=6.168",
    "respx~=0.23",
    "openapi-core~=0.19",
    "ruff~=0.16",
    "mypy~=2.3",
    "types-PyYAML",
    "import-linter~=2.15",
    "agentevals~=0.0.9",
    "openevals~=0.2",
    "poethepoet~=0.48",
    "pre-commit~=4.3",
    "colorama~=0.4",
]

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_agent"]

# ---------------------------------------------------------------------------------------------------------------------
# Tooling.
# ---------------------------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shop_agent.graphs.*", "shop_agent.agents.*"]
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["pytrends.*", "selectolax.*", "agentevals.*", "openevals.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -m 'not db and not server and not eval and not live and not runtime'"
markers = [
    "db: needs Postgres with pgvector (AGENT_TEST_DATABASE_URL)",
    "server: starts `langgraph dev` in a subprocess",
    "eval: runs a real model (evals)",
    "live: calls a real external service",
    "runtime: needs the prod-like runtime (Aegra) stack",
]

[tool.coverage.run]
source = ["shop_agent"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------------------------------------------------
# Layering (docs/ARCHITECTURE.md section 12, plan section 2.7).
# ---------------------------------------------------------------------------------------------------------------------

[tool.importlinter]
root_package = "shop_agent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: ops > graphs > wiring > agents > tools > adapters > domain"
type = "layers"
layers = [
    "shop_agent.ops",
    "shop_agent.graphs",
    "shop_agent.wiring",
    "shop_agent.agents",
    "shop_agent.tools",
    "shop_agent.adapters",
    "shop_agent.domain",
]

[[tool.importlinter.contracts]]
name = "The domain imports no framework, database or HTTP library"
type = "forbidden"
source_modules = ["shop_agent.domain"]
forbidden_modules = [
    "langchain",
    "langchain_core",
    "langchain_community",
    "langgraph",
    "langgraph_sdk",
    "deepagents",
    "psycopg",
    "httpx",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Only shop_agent.llm imports model provider packages"
type = "forbidden"
source_modules = [
    "shop_agent.domain",
    "shop_agent.adapters",
    "shop_agent.tools",
    "shop_agent.agents",
    "shop_agent.wiring",
    "shop_agent.graphs",
    "shop_agent.ops",
    "shop_agent.knowledge",
    "shop_agent.config",
    "shop_agent.testing",
]
forbidden_modules = ["langchain_ollama", "langchain_anthropic", "langchain_openai", "langchain_google_genai"]
# llm is the provider boundary; reaching a provider through that boundary is allowed.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Test support is imported only by shop_agent.llm (and tests)"
type = "forbidden"
source_modules = [
    "shop_agent.domain",
    "shop_agent.adapters",
    "shop_agent.tools",
    "shop_agent.agents",
    "shop_agent.graphs",
    "shop_agent.knowledge",
]
forbidden_modules = ["shop_agent.testing"]
# Only direct imports are forbidden: `llm` builds the scripted model for the `scripted` profile, and modules that use
# `llm` reach `testing` through it.
allow_indirect_imports = true

# ---------------------------------------------------------------------------------------------------------------------
# Tasks (cross-platform, run with `uv run poe <task>`).
# ---------------------------------------------------------------------------------------------------------------------

[tool.poe.tasks]
fmt = { shell = "ruff format . && ruff check --fix ." }
lint = { shell = "ruff format --check . && ruff check ." }
types = "mypy"
arch = "lint-imports"
# Coverage floor on the domain (plan: Phase 2 >= 90%); growth rules join it in Phase 7.
test = "pytest -q --cov=shop_agent.domain --cov-fail-under=90"
check = ["lint", "types", "arch", "test"]
dev = "shop-agent dev"  # langgraph dev, then sync-crons once healthy
simulate = "shop-agent simulate"
doctor = "shop-agent doctor"
llm-simulator = "shop-agent llm-simulator"
ingest = "shop-agent ingest"
collect = "shop-agent collect"
eval = "python -m evals.runner"
eval-local = "python -m evals.runner --profile local"
gate = "python ../../scripts/gate.py"
