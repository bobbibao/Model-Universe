# Optional local hooks (`pre-commit install`). CI does not depend on them; it runs the same checks directly.
exclude: ^apps/agent-service/legacy/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/agent-service/
      - id: ruff-format
        files: ^apps/agent-service/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: prettier-web
        name: prettier (web, changed files)
        entry: bash -c 'cd apps/web-ecommerce && yarn prettier --write "${@#apps/web-ecommerce/}"' --
        language: system
        files: ^apps/web-ecommerce/.*\.(ts|tsx|js|jsx|json|css)$
