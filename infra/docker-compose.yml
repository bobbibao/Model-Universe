# Local stack for the v2 agent (docs/ARCHITECTURE.md): one Postgres 18 with pgvector holding the web shop's database
# (read by the agent only as `ci_reader`) and the agent's own database `shop_agent`; the web app; the Agent Server.
#
# No default credentials: every secret comes from infra/.env (git-ignored; template infra/.env.example) and compose
# refuses to start while one is missing. Postgres listens on 127.0.0.1:55432 so it does not clash with a local
# Postgres on 5432.
#
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d db web agent-server
#
# End-to-end stack (the e2e workflow; docs/DEMO.md): seed the shop, start, then index the knowledge and set the crons.
#
#   CE="docker compose -f infra/docker-compose.yml --env-file infra/.env --profile e2e"
#   $CE run --rm seed && $CE up -d --wait db web agent-server && $CE run --rm ingest
#
# Optional local model host (Linux with a GPU): add `--profile local-llm` and set OLLAMA_BASE_URL=http://ollama:11434.
name: shop-agent

x-agent-env: &agent-env
  APP_ENV: ${APP_ENV:-dev}
  LLM_PROFILE: ${LLM_PROFILE:-local}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DATABASE_URL: postgresql://shop_agent:${SHOP_AGENT_PASSWORD}@db:5432/shop_agent
  SHOP_READ_DSN: postgresql://ci_reader:${CI_READER_PASSWORD}@db:5432/web_ecommerce
  SHOP_ADAPTER: ${SHOP_ADAPTER:-sql}
  SHOP_API_BASE_URL: http://web:6050/api/agent/v1
  SHOP_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN in infra/.env}
  AGENT_ACTOR_SECRET: ${AGENT_ACTOR_SECRET:?set AGENT_ACTOR_SECRET in infra/.env}
  DEMO_MEASURE_AFTER_MINUTES: ${DEMO_MEASURE_AFTER_MINUTES:-}  # demo only; empty = off
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}

x-web-db-env: &web-db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_USERNAME: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_NAME: web_ecommerce
  LOGGER: CONSOLE
  LOG_LEVEL: ${WEB_LOG_LEVEL:-info}

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      CI_READER_PASSWORD: ${CI_READER_PASSWORD:?set CI_READER_PASSWORD in infra/.env}
      SHOP_AGENT_PASSWORD: ${SHOP_AGENT_PASSWORD:?set SHOP_AGENT_PASSWORD in infra/.env}
      WEB_DB_NAME: web_ecommerce
    ports: ["127.0.0.1:${DB_HOST_PORT:-55432}:5432"]
    volumes:
      - dbdata:/var/lib/postgresql
      - ./sql:/sql:ro
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro  # first start only: web database, ci_reader, shop_agent + vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # Development Agent Server (`langgraph dev`, in-memory runtime). The production runtime is Aegra (ADR-0013); e2e runs
  # here until the gaps recorded in ADR-0013 are closed (Phase 9).
  agent-server:
    build: ../apps/agent-service
    image: shop-agent/agent:local
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "2024", "--no-browser", "--no-reload"]
    environment: *agent-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:2024:2024"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok')"]
      interval: 5s
      retries: 30

  web:
    build: ../apps/web-ecommerce
    image: shop-agent/web:local
    environment:
      <<: *web-db-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}  # plain HTTP on localhost; set true behind HTTPS
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AGENT_SERVER_URL: http://agent-server:2024
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      AGENT_ACTOR_SECRET: ${AGENT_ACTOR_SECRET}
      AGENT_APPROVAL_SECRET: ${AGENT_APPROVAL_SECRET:?set AGENT_APPROVAL_SECRET in infra/.env}
    depends_on:
      db: {condition: service_healthy}
      # The analytics views are created when the web starts, so it starts after the seed (e2e profile only).
      seed: {condition: service_completed_successfully, required: false}
    ports: ["127.0.0.1:6050:6050"]
    volumes: [uploads:/app/uploads]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6050/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 60

  # One-shot: drop, recreate and seed the shop tables with the development seed profile, then exit (non-zero on any
  # seeding error). Destroys the shop data: e2e and throwaway databases only.
  seed:
    profiles: ["e2e"]
    build: ../apps/web-ecommerce
    image: shop-agent/web:local
    command: ["node", "dist/.next/scripts/seed.js"]
    environment:
      <<: *web-db-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in infra/.env}
    depends_on:
      db: {condition: service_healthy}

  # One-shot: index the knowledge base (SOPs, brand guide, catalog) and create the Agent Server's crons. The dev
  # server keeps crons in memory, so this runs again after every agent-server start.
  ingest:
    profiles: ["e2e"]
    build: ../apps/agent-service
    image: shop-agent/agent:local
    command: ["sh", "-c", "shop-agent ingest && shop-agent sync-crons"]
    environment:
      <<: *agent-env
      AGENT_SERVER_URL: http://agent-server:2024
    depends_on:
      agent-server: {condition: service_healthy}

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: 30m
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]

volumes:
  dbdata:
  ollama:
  uploads:
