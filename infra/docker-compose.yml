services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sme
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  agent-service:
    build: ../apps/agent-service
    env_file: ../.env
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ../apps/web
    env_file: ../.env
    depends_on: [db, agent-service]
    ports: ["3000:3000"]
volumes:
  dbdata:
