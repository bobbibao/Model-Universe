openapi: 3.1.0
info:
  title: CI Agent Service
  version: 0.2.0
  description: |
    Called by the web app's admin proxy (apps/web-ecommerce, /api/admin/ci/*), never by browsers directly.
    All amounts are VND (est_* on options, plan estimated_cost, the value_at_risk metric, and KPI deltas whose
    unit is "vnd"); KPI deltas carry a unit (vnd | percent | days | number).
    Every route except /health and the channel webhooks requires an actor token (see securitySchemes).
components:
  securitySchemes:
    actorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT minted by the web app per request, signed with AGENT_ACTOR_SECRET (shared by both apps,
        distinct from the web session secret). Required claims:
          iss = web-ecommerce, aud = ci-agent, typ = ci_actor,
          sub = web user id (string), ci_role = staff | manager | owner,
          iat, exp (exp - iat <= 300 seconds; 10 seconds clock leeway).
        Any failure answers 401 without detail.
  responses:
    ShopUnavailable:
      description: |
        The agent cannot read the shop (analytics views missing, no grant, database unreachable). `detail` says
        why, e.g. "Shop data unavailable: analytics views missing: ...". On a decision, the answer is still
        recorded ("Decision recorded, but ..."), and the next run continues it.
security: [{actorToken: []}]
paths:
  /health:
    get:
      summary: Liveness probe
      security: []
      responses: {"200": {description: OK}}
  /improvements:
    get:
      summary: List improvements (optionally filtered by status)
      parameters:
        - {name: status, in: query, schema: {type: string}}
      responses: {"200": {description: OK}, "400": {description: Unknown status}, "401": {description: Invalid token}}
  /improvements/{id}:
    get:
      summary: |
        Improvement detail: the list fields plus subject SKUs, signal metrics, finding (causes with `source`: ai | rules, SOP refs), the open
        (or latest) question, answers, status history, plan, action records, measurement and case id
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses: {"200": {description: OK}, "401": {description: Invalid token}, "404": {description: Not found}}
  /improvements/{id}/decision:
    post:
      summary: Answer the open question - approve (with an option and optional overrides), reject, or ask for clarification
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {enum: [approve, reject, clarify]}
                option_id: {type: string}
                overrides: {type: object, description: "Keys must be a subset of the option's params"}
                note: {type: string}
      responses:
        "202": {description: Accepted, the improvement advances}
        "400": {description: Unknown option or invalid overrides}
        "401": {description: Invalid token}
        "403": {description: The actor's ci_role cannot approve this}
        "404": {description: Improvement not found}
        "409": {description: The question is no longer open}
        "503": {$ref: "#/components/responses/ShopUnavailable"}
        "422": {description: Malformed body}
  /runs:
    post:
      summary: Manually trigger one Detect + advance-all cycle (ci_role manager or owner)
      responses: {"202": {description: Accepted}, "401": {description: Invalid token}, "403": {description: Role too low}, "503": {$ref: "#/components/responses/ShopUnavailable"}}
  /kpi/impact:
    get:
      summary: |
        Before/after KPI deltas for every measured, closed improvement, most recently measured first. Each item:
        improvement_id, signal_kind, signal_summary, strategy, auto_approved, measured_at, verdict
        (success | inconclusive | negative), summary, deltas[] {name, baseline, current, delta_pct, improved,
        improvement_pct (positive = better for that KPI)}
      responses: {"200": {description: OK}, "401": {description: Invalid token}}
  /cases:
    get:
      summary: |
        Case library, most recent first (up to 100; includes rejections, expirations and failures). Each case:
        id, improvement_id, signal_kind, situation, options_considered[], decision (approved:<strategy> |
        approved:<strategy>:failed | rejected | expired | dismissed), strategy, outcome_verdict, kpi_summary
        {kpi name: improvement_pct}, lessons[], tags[], created_at
      responses: {"200": {description: OK}, "401": {description: Invalid token}}
  /webhooks/telegram:
    post:
      summary: Telegram button taps; verified by X-Telegram-Bot-Api-Secret-Token (refused when no secret is configured)
      security: []
      responses: {"200": {description: OK}, "401": {description: Invalid or unconfigured secret}}
