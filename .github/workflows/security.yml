name: security

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --no-banner --redact

  python-deps:
    name: Python dependency audit (report-only until Phase 9)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/agent-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --all-extras --no-hashes --no-emit-project > requirements.audit.txt
      - run: uvx pip-audit -r requirements.audit.txt

  node-deps:
    name: Node dependency audit (report-only until Phase 9)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web-ecommerce
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn npm audit --all --recursive --severity high
