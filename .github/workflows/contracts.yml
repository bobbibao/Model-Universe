name: contracts

on:
  push:
    paths:
      - packages/contracts/**
      - .github/workflows/contracts.yml
  pull_request:
    paths:
      - packages/contracts/**
      - .github/workflows/contracts.yml
  workflow_dispatch:

jobs:
  lint:
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y @redocly/cli@2 lint --config packages/contracts/redocly.yaml
