name: web

on:
  push:
    paths:
      - apps/web-ecommerce/**
      - packages/contracts/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - apps/web-ecommerce/**
      - packages/contracts/**
      - .github/workflows/web.yml
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web-ecommerce

jobs:
  check:
    name: lint, types, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn type-check
      - run: yarn test
      - run: yarn build

  db:
    name: database tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # a job-local throwaway container: no password in the repo
          POSTGRES_DB: web_ecommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USERNAME: postgres
      TEST_DB_NAME: web_ecommerce_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test:db
