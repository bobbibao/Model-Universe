name: agent

on:
  push:
    paths:
      - apps/agent-service/**
      - packages/contracts/**
      - .claude/skills/**
      - infra/sql/**
      - .github/workflows/agent.yml
  pull_request:
    paths:
      - apps/agent-service/**
      - packages/contracts/**
      - .claude/skills/**
      - infra/sql/**
      - .github/workflows/agent.yml
  workflow_dispatch:

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/agent-service

jobs:
  check:
    name: lint, types, layering, unit and graph tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent-service/uv.lock
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run poe check

  db:
    name: database tests (pgvector)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      AGENT_TEST_DATABASE_URL: postgresql://shop_agent_test:citest@localhost:5432/shop_agent_test
      PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent-service/uv.lock
      - name: Create the agent test database with pgvector
        working-directory: .
        run: |
          psql -h localhost -U postgres -d postgres -v agent_password=citest -v agent_role=shop_agent_test \
               -v agent_db=shop_agent_test -f infra/sql/shop_agent.sql
          psql -h localhost -U postgres -d shop_agent_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: uv sync --frozen --all-extras --python 3.12
      - name: pytest -m db
        run: uv run pytest -q -m db

  server:
    name: Agent Server tests (langgraph dev)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent-service/uv.lock
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run pytest -q -m server
