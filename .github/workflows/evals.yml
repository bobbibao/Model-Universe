name: evals

on:
  push:
    paths:
      - apps/agent-service/evals/**
      - apps/agent-service/skills/**
      - apps/agent-service/config/llm/**
      - apps/agent-service/src/shop_agent/agents/**
      - apps/agent-service/src/shop_agent/graphs/**
      - apps/agent-service/src/shop_agent/testing/scripts/**
      - .github/workflows/evals.yml
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"   # nightly (03:17 Asia/Ho_Chi_Minh); scheduled runs use the default branch

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/agent-service

jobs:
  evals:
    name: agent evals
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent-service/uv.lock
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Scripted suites (harness check, no network)
        run: |
          for suite in $(ls evals/suites | grep -v __); do
            uv run python -m evals.runner --suite "$suite" --profile scripted --gate
          done
      - name: Hosted suites (Claude)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skipped: no ANTHROPIC_API_KEY secret"
            exit 0
          fi
          for suite in $(ls evals/suites | grep -v __); do
            uv run python -m evals.runner --suite "$suite" --profile anthropic --gate
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: apps/agent-service/evals/results/
          if-no-files-found: ignore
